<title>Objekt-Leitstand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,500;112,700;125,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Leitstand – feste Seitenleiste, Arbeitsfläche rechts; Anlagen als „Typenschilder“ */
:root{
  --bg:#121416; --surface:#191c1f; --surface2:#21252a; --line:#30353b; --fg:#e8e5df; --muted:#9ba1a7;
  --accent:#c98f5f; --accent-ink:#1b130c; --accent-soft:rgba(201,143,95,.14);
  --red:#ef5a5f; --red-soft:rgba(239,90,95,.14); --amber:#e3a83d; --amber-soft:rgba(227,168,61,.14); --green:#55b98a; --green-soft:rgba(85,185,138,.14);
  --plate:#24282d; --rivet:#4a5058;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f1f0ec; --surface:#ffffff; --surface2:#e9e7e1; --line:#d6d3cb; --fg:#1c1e20; --muted:#5d6166;
  --accent:#9c5d2b; --accent-ink:#ffffff; --accent-soft:rgba(156,93,43,.10);
  --red:#c42b30; --red-soft:rgba(196,43,48,.09); --amber:#a86f00; --amber-soft:rgba(168,111,0,.10); --green:#23825a; --green-soft:rgba(35,130,90,.10);
  --plate:#f6f5f1; --rivet:#b9b5ac; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f1f0ec; --surface:#ffffff; --surface2:#e9e7e1; --line:#d6d3cb; --fg:#1c1e20; --muted:#5d6166;
  --accent:#9c5d2b; --accent-ink:#ffffff; --accent-soft:rgba(156,93,43,.10);
  --red:#c42b30; --red-soft:rgba(196,43,48,.09); --amber:#a86f00; --amber-soft:rgba(168,111,0,.10); --green:#23825a; --green-soft:rgba(35,130,90,.10);
  --plate:#f6f5f1; --rivet:#b9b5ac; color-scheme:light }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font-family:var(--f-display);font-stretch:125%;font-weight:800;letter-spacing:.02em;font-size:17px;line-height:1.1;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-mono);font-stretch:100%;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:none;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--fg)}
.nav a.call{background:var(--accent);color:var(--accent-ink);margin-bottom:8px}
.nav a.call:hover{filter:brightness(1.08)}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:9px;background:var(--red-soft);color:var(--red)}
.nav svg{width:16px;height:16px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:max-content}
.lang button{border:0;background:transparent;padding:5px 12px;font-family:var(--f-mono);font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--fg);color:var(--bg)}
.mode{font-size:12px;color:var(--muted)}
.main{min-width:0;padding-block:28px 64px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.head .eyebrow{margin-bottom:6px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-stretch:112%;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .sub{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;text-decoration:none}
.item:first-child{border-top:0}
.item:hover .ttl{color:var(--accent)}
.item .bar{align-self:stretch;border-radius:2px;background:var(--line)}
.item .ttl{font-weight:700}
.item .meta{font-size:13px;color:var(--muted)}
.bar.red{background:var(--red)} .bar.amber{background:var(--amber)} .bar.green{background:var(--green)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.red{color:var(--red);background:var(--red-soft)} .sev.amber{color:var(--amber);background:var(--amber-soft)} .sev.green{color:var(--green);background:var(--green-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:700}
.chip:hover{border-color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:600}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.banner{border:1px solid var(--amber);background:var(--amber-soft);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:18px}
/* Typenschild */
.plate{position:relative;background:var(--plate);border:1px solid var(--line);border-radius:4px;padding:16px 18px 14px;text-decoration:none;display:block;min-width:0}
.plate::before,.plate::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--line),var(--rivet));top:8px}
.plate::before{left:8px}.plate::after{right:8px}
a.plate:hover{border-color:var(--accent)}
.plate .p-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.plate .p-code{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:13px;letter-spacing:.08em;color:var(--accent)}
.plate .p-name{font-weight:700;font-size:15px;line-height:1.3}
.plate dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:8px 0 0;font-size:13px}
.plate dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.plate dd{margin:0;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;background:var(--surface2);display:block;max-width:100%}
.prop-card{display:flex;flex-direction:column;gap:10px;text-decoration:none}
.prop-card:hover h2{color:var(--accent)}
.ph{width:100%;aspect-ratio:16/9;border-radius:4px;background:repeating-linear-gradient(135deg,var(--surface2) 0 10px,var(--surface) 10px 20px);display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px;max-width:100%}
/* Störung aufnehmen */
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.step .n{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.light{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r);border:1px solid}
.light.red{border-color:var(--red);background:var(--red-soft)} .light.amber{border-color:var(--amber);background:var(--amber-soft)} .light.green{border-color:var(--green);background:var(--green-soft)}
.lamp{display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--bg);border-radius:14px;flex:none}
.lamp i{width:14px;height:14px;border-radius:50%;background:var(--surface2);display:block}
.light.red .lamp i.r{background:var(--red);box-shadow:0 0 10px var(--red)}
.light.amber .lamp i.a{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.light.green .lamp i.g{background:var(--green);box-shadow:0 0 10px var(--green)}
.light h2{font-size:20px}
.qs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.qs label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.qs input{margin-top:4px;accent-color:var(--accent)}
.cause{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.cause:first-child{border-top:0}
.meter{display:flex;gap:2px;margin-top:5px}
.meter i{width:10px;height:6px;border-radius:1px;background:var(--surface2)}
.meter i.on{background:var(--accent)}
.cost{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.callwho{display:flex;flex-direction:column;gap:8px}
.contact{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.phone{font-family:var(--f-mono);font-weight:600;font-size:15px;user-select:all}
textarea,input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=search],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
textarea{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.form .wide{grid-column:1/-1}
.ai{border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;background:var(--accent-soft)}
.ai .eyebrow{color:var(--accent)}
.prose{max-width:68ch}
.prose p{margin:0 0 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
.tscroll{overflow-x:auto}
.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.due-over{color:var(--red);font-weight:700}.due-soon{color:var(--amber);font-weight:700}
.check{border-radius:var(--r);padding:12px 14px;font-size:14px}
.check.warn{background:var(--amber-soft);border:1px solid var(--amber)}
.check.ok{background:var(--green-soft);border:1px solid var(--green)}
.check.bad{background:var(--red-soft);border:1px solid var(--red)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(680px,100%);max-height:100%;overflow:auto;padding:20px}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.qr{background:#fff;padding:10px;border-radius:4px;width:max-content}
.qr img,.qr canvas{display:block;width:150px;height:150px}
.gl-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.gl-row b{font-weight:700}
.cat-card{cursor:pointer}
.cat-card:hover{border-color:var(--accent)}
details summary{cursor:pointer;font-weight:700}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand small{display:none}
  .brand{font-size:13px;flex:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;gap:4px;scrollbar-width:none}
  .nav a{padding:6px 10px;white-space:nowrap;font-size:13px}
  .nav a.call{margin-bottom:0}
  .nav svg{display:none}
  .side-foot{margin-top:0;flex:none}
  .side-foot .mode{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-top:20px}
  h1{font-size:23px}
  .gl-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .gl-row .gl-x{grid-column:1/-1}
}

/* v2 */
.langfix{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:40;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.main{padding-top:64px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col h3{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.col h3 .mono{font-size:12px;color:var(--muted)}
.tcard{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:9px 10px 9px 0;text-decoration:none;overflow:hidden}
.tcard:hover{border-color:var(--accent)}
.tcard .bar{border-radius:0 2px 2px 0;background:var(--line)}
.tcard .ttl{font-weight:700;font-size:14px;line-height:1.3}
.tcard .meta{font-size:12px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:13px;color:var(--accent)}
.tl.done .ic{background:var(--green-soft);color:var(--green)}
.tl .when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.qlog{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mail{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:4px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.bgroup{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.bgroup:first-of-type{border-top:0;margin-top:0;padding-top:0}
.say{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.say .en{color:var(--muted);font-size:13px;margin-top:4px}
.rem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem.due .when{color:var(--red);font-weight:700}
.rem .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.alertbox{border:1px solid var(--red);background:var(--red-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .side{padding-right:104px}
  .langfix{top:calc(10px + env(safe-area-inset-top,0px))}
  .main{padding-top:20px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dd{margin-bottom:6px}
}
</style>

<div class="lang langfix" role="group" aria-label="Sprache / Language">
  <button type="button" id="lang-de">DE</button><button type="button" id="lang-en">EN</button>
</div>
<div class="shell">
  <aside class="side">
    <div class="brand">Objekt-Leitstand<small>Raavn · Facility</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="mode" id="mode"></div></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Fachwissen: Anlagen, Symptome, Ursachen, Prüfpflichten, Wörterbuch (DE/EN)
const L = (de, en) => ({ de, en });

const TRADES = {
  heating: L("Heizung & Sanitär", "Heating & plumbing"),
  electrical: L("Elektro", "Electrical"),
  doors: L("Tore & Türen", "Doors & gates"),
  fire: L("Brandschutz", "Fire safety"),
  lift: L("Aufzug", "Lift"),
  hvac: L("Lüftung & Klima", "Ventilation & AC"),

  const items = [
    ["call", I.call, tl("Störung aufnehmen", "Log a fault"), "call"],
    ["dashboard", I.dash, tl("Übersicht", "Overview"), "", due],
    ["objects", I.obj, tl("Objekte", "Properties")],
    ["tickets", I.rep, tl("Reparaturen", "Repairs"), "", open],
    ["inspections", I.insp, tl("Prüfungen", "Inspections"), "", overdue],
    ["contractors", I.con, tl("Dienstleister", "Contractors")],
    ["catalog", I.cat, tl("Anlagen-Wissen", "Equipment guide")],
    ["glossary", I.gl, tl("Wörterbuch", "Glossary")]
  ];
  const active = /^[pm]-/.test(r) ? "objects" : r.startsWith("t-") ? "tickets" : r;
  $("#nav").innerHTML = items.map(([k, ic, label, cls, cnt]) =>
    `<a href="#${k}" class="${cls || ""} ${active === k ? "on" : ""}">${ic}<span>${esc(label)}</span>${cnt ? `<span class="cnt">${cnt}</span>` : ""}</a>`).join("");
  $("#lang-de").classList.toggle("on", lang === "de");
  $("#lang-en").classList.toggle("on", lang === "en");
  $("#mode").textContent = mode === "db" ? tl("Gespeichert in deinem Konto", "Saved to your account") : mode === "local" ? tl("Vorschau – nichts wird gespeichert", "Preview – nothing is saved") : tl("Verbinde…", "Connecting…");
  document.documentElement.lang = lang;
}

function render(force) {
  renderNav();
  const r = route();
  if (!force && r === lastRoute && typing()) { pendingRender = true; return; }
  pendingRender = false; lastRoute = r;
  const v = $("#view");
  const ready = COLS.every(c => loaded[c]);
  let html = "";
  if (mode === "local") html += `<div class="banner">${tl("Vorschau-Modus: Diese Ansicht kann keine Daten speichern. Öffne die App angemeldet in Claude, damit deine Objekte gespeichert werden.", "Preview mode: this view can't save data. Open the app signed in to Claude so your properties are saved.")}</div>`;
  if (!ready) { v.innerHTML = html + `<div class="empty"><span class="spin"></span><br>${tl("Lade Daten…", "Loading data…")}</div>`; return; }
  if (r === "call") html += viewCall();
  else if (r === "objects") html += viewObjects();
  else if (r.startsWith("p-")) html += viewProperty(r.slice(2));
  else if (r.startsWith("m-")) html += viewMachine(r.slice(2));
  else if (r.startsWith("t-")) html += viewTicket(r.slice(2));
  else if (r === "tickets") html += viewTickets();
  else if (r === "inspections") html += viewInspections();
  else if (r === "contractors") html += viewContractors();
  else if (r === "catalog") html += viewCatalog();
  else if (r === "glossary") html += viewGlossary();
  else html += viewDashboard();
  v.innerHTML = html;
  afterRender(r);
}

/* ---------- Anzeige-Helfer ---------- */
const sevPill = s => s && SEV[s] ? `<span class="sev ${s}">${esc(tr(SEV[s].label))}</span>` : "";
const machineName = m => m ? (m.name || tr(catOf(m)?.name) || tl("Anlage", "Equipment")) : "";
const propName = id => S.properties[id]?.name || tl("Unbekanntes Objekt", "Unknown property");
const STATUS = { open: L("Offen", "Open"), assigned: L("Beauftragt", "Assigned"), waiting: L("Wartet auf Angebot", "Waiting for quote"), done: L("Erledigt", "Done") };
const meter = (n, max = 3) => `<span class="meter" aria-label="${n}/${max}">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
const costSigns = k => "€".repeat(k || 1);
const example = o => o && o.example ? ` <span class="tag">${tl("Beispiel", "Example")}</span>` : "";
const inspTitle = i => i.titleL ? tr(i.titleL) : i.title;
const ago = d => { const n = -daysUntil(d); return n <= 0 ? tl("heute", "today") : n === 1 ? tl("seit gestern", "since yesterday") : tl(`seit ${n} Tagen`, `${n} days`); };

function contractorsFor(trade, machine) {
  const list = [];
  if (machine && machine.contractorId && S.contractors[machine.contractorId]) list.push({ id: machine.contractorId, ...S.contractors[machine.contractorId], main: true });
  vals("contractors").filter(c => c.trade === trade && !list.find(x => x.id === c.id)).forEach(c => list.push(c));
  return list;
}
function copyBtn(text) { return text ? `<button class="btn sm" data-copy="${esc(text)}">${tl("Kopieren", "Copy")}</button>` : ""; }
function contactCard(c) {
  return `<div class="contact">
    <div><div style="font-weight:700">${esc(c.name)}${c.main ? ` <span class="tag">${tl("zuständig", "assigned")}</span>` : ""}${c.emergency ? ` <span class="tag">24/7</span>` : ""}</div>
    <div class="muted" style="font-size:13px">${esc(c.roleLabel || tr(TRADES[c.trade]) || "")}${c.notes ? " · " + esc(c.notes) : ""}</div></div>
    <div class="row"><span class="phone">${esc(c.phone || "–")}</span>${copyBtn(c.phone)}</div>
  </div>`;
}
function ticketRow(t) {
  const m = S.machines[t.machineId];
  return `<a class="item" href="#t-${t.id}"><span class="bar ${t.severity || ""}"></span><span><span class="ttl">${esc(t.title)}</span>${example(t)}<br><span class="meta">${esc(propName(t.propertyId))}${m ? " · " + esc(machineName(m)) : ""} · ${esc(tr(STATUS[t.status] || STATUS.open))}</span></span><span>${sevPill(t.severity)}</span></a>`;
}
function inspRow(i) {
  const d = daysUntil(i.next); const cls = d < 0 ? "due-over" : d <= 30 ? "due-soon" : "";
  const m = S.machines[i.machineId];
  return `<div class="item" data-insp="${i.id}" tabindex="0"><span class="bar ${d < 0 ? "red" : d <= 30 ? "amber" : ""}"></span><span><span class="ttl">${esc(inspTitle(i))}</span>${example(i)}<br><span class="meta">${esc(propName(i.propertyId))}${m ? " · " + esc(machineName(m)) : ""}</span></span><span class="mono ${cls}">${fmtDate(i.next)}</span></div>`;
}
function remRow(r, showProp) {
  const due = !r.done && r.at <= nowLocal();
  return `<div class="rem ${due ? "due" : ""}"><div><div style="font-weight:700;${r.done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(r.subject)}${example(r)}</div><div class="when">${fmtDT(r.at)}${showProp ? " · " + esc(propName(r.propertyId)) : ""}</div>${r.note ? `<div class="muted" style="font-size:13px">${esc(r.note)}</div>` : ""}</div>
    <div class="row" style="flex-wrap:nowrap">${r.done ? "" : `<button class="btn sm" data-act="rem-done" data-id="${r.id}">${tl("Erledigt", "Done")}</button>`}<button class="btn sm ghost" data-act="edit-rem" data-id="${r.id}">${tl("Bearbeiten", "Edit")}</button></div></div>`;
}

/* ---------- Übersicht ---------- */
function viewDashboard() {
  const props = vals("properties");
  if (!props.length) return `<div class="head"><div><div class="eyebrow">${tl("Übersicht", "Overview")}</div><h1>${tl("Willkommen im Objekt-Leitstand", "Welcome to your property control room")}</h1></div></div>
    <div class="empty"><b>${tl("Noch keine Objekte", "No properties yet")}</b>${tl("Lege dein erstes Objekt an, dann füge seine Anlagen hinzu.", "Add your first property, then add its equipment.")}<br><br><button class="btn primary" data-act="new-prop">${tl("Objekt anlegen", "Add property")}</button></div>`;
  const tickets = vals("tickets");
  const open = tickets.filter(t => t.status !== "done");
  const insp = vals("inspections").filter(i => i.next).sort((a, b) => a.next.localeCompare(b.next));
  const due = insp.filter(i => daysUntil(i.next) <= 60);
  const overdue = insp.filter(i => daysUntil(i.next) < 0).length;
  const rent = props.reduce((s, p) => s + (Number(p.rent) || 0), 0);
  const yr = String(new Date().getFullYear());
  const repairs = tickets.filter(t => (t.created || "").startsWith(yr)).reduce((s, t) => s + (Number(t.cost) || 0), 0);
  const endToday = today() + "T23:59";
  const rems = vals("reminders").filter(r => !r.done && r.at && r.at <= endToday).sort((a, b) => a.at.localeCompare(b.at));
  // Board
  const bp = UI.boardProp;
  const inP = t => !bp || t.propertyId === bp;
  const todo = tickets.filter(t => inP(t) && (t.status || "open") === "open");
  const prog = tickets.filter(t => inP(t) && (t.status === "assigned" || t.status === "waiting"));
  const done = tickets.filter(t => inP(t) && t.status === "done" && daysUntil((t.doneAt || t.created || today())) >= -30);
  const sevOrder = t => ["red", "amber", "green"].indexOf(t.severity);
  const card = t => { const m = S.machines[t.machineId]; const last = (t.log || []).slice(-1)[0];
    return `<a class="tcard" href="#t-${t.id}"><span class="bar ${t.status === "done" ? "green" : t.severity || ""}"></span><span><span class="ttl">${esc(t.title)}</span><br><span class="meta">${esc(propName(t.propertyId))}${m ? " · " + esc(machineName(m)) : ""}</span><br><span class="meta">${t.status === "done" ? tl("erledigt ", "done ") + fmtDate(t.doneAt || t.created) : ago(t.created || today())}${last && t.status !== "done" ? " · " + esc(tr(LOG_TYPES[last.type]?.l)) : ""}</span></span></a>`; };
  const col = (title, list, emptyTxt) => `<div class="col"><h3>${title}<span class="mono">${list.length}</span></h3>${list.length ? list.sort((a, b) => sevOrder(a) - sevOrder(b)).map(card).join("") : `<p class="muted" style="font-size:13px;margin:0">${emptyTxt}</p>`}</div>`;
  return `
  <div class="head"><div><div class="eyebrow">${tl("Übersicht", "Overview")} · ${fmtDate(today())}</div><h1>${open.length ? tl(`${open.length} offene Störungen`, `${open.length} open faults`) : tl("Alles ruhig", "All quiet")}</h1></div>
    <a class="btn primary" href="#call">${tl("Anruf: Störung aufnehmen", "Call: log a fault")}</a></div>
  ${rems.length ? `<section class="alertbox"><div class="row" style="justify-content:space-between;margin-bottom:4px"><h2>${tl("Heute & überfällig", "Today & overdue")}</h2><span class="mono">${rems.length}</span></div>${rems.map(r => remRow(r, true)).join("")}</section>` : ""}
  <div class="stats">
    <div class="stat"><span class="eyebrow">${tl("Offene Störungen", "Open faults")}</span><b>${open.length}</b><span class="sub">${["red", "amber", "green"].map(s => { const n = open.filter(t => t.severity === s).length; return n ? `${n} ${esc(tr(SEV[s].label))}` : ""; }).filter(Boolean).join(" · ") || "–"}</span></div>
    <div class="stat"><span class="eyebrow">${tl("Prüfungen fällig (60 Tage)", "Inspections due (60 days)")}</span><b>${due.length}</b><span class="sub ${overdue ? "due-over" : ""}">${overdue ? tl(`${overdue} überfällig`, `${overdue} overdue`) : tl("nichts überfällig", "none overdue")}</span></div>
    <div class="stat"><span class="eyebrow">${tl("Miete pro Monat", "Rent per month")}</span><b>${money(rent)}</b><span class="sub">${props.length} ${tl("Objekte", "properties")}</span></div>
    <div class="stat"><span class="eyebrow">${tl("Reparaturkosten", "Repair costs")} ${yr}</span><b>${money(repairs)}</b><span class="sub">${tl("Freigabegrenze", "Approval limit")} ${money(S.settings.limit)}</span></div>
  </div>
  <section style="margin-bottom:18px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>${tl("Aufgaben", "To do")}</h2>
    <select id="board-prop" style="width:auto;min-width:200px"><option value="">${tl("Alle Objekte", "All properties")}</option>${props.map(p => `<option value="${p.id}" ${bp === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
    <div class="board">${col(tl("Zu erledigen", "To do"), todo, tl("Nichts offen.", "Nothing open."))}${col(tl("In Arbeit", "In progress"), prog, tl("Nichts in Arbeit.", "Nothing in progress."))}${col(tl("Erledigt (30 Tage)", "Done (30 days)"), done, tl("Noch nichts erledigt.", "Nothing done yet."))}</div></section>
  <div class="grid g2">
    <section class="panel"><h2>${tl("Nächste Prüfungen", "Upcoming inspections")}</h2>${insp.length ? `<div class="list">${insp.slice(0, 6).map(inspRow).join("")}</div>` : `<p class="muted">${tl("Noch keine Prüfungen eingetragen.", "No inspections yet.")}</p>`}</section>
    <section class="panel"><h2>${tl("Objekte", "Properties")}</h2><div class="list">${props.map(p => {
      const o = open.filter(t => t.propertyId === p.id).length;
      return `<a class="item" href="#p-${p.id}"><span class="bar ${o ? "amber" : ""}"></span><span><span class="ttl">${esc(p.name)}</span>${example(p)}<br><span class="meta">${esc(p.tenant || "–")} · ${esc(p.address || "")}</span></span><span class="mono">${money(p.rent)}</span></a>`; }).join("")}</div></section>
    <section class="panel"><h2>${tl("Einstellungen", "Preferences")}</h2><div class="form">
      <label class="field"><span>${tl("Freigabegrenze für Reparaturen (€)", "Approval limit for repairs (€)")}</span><input type="number" id="set-limit" min="0" step="50" value="${esc(S.settings.limit)}"></label>
      <label class="field"><span>${tl("Name unter E-Mails", "Name under emails")}</span><input type="text" id="set-sign" value="${esc(S.settings.signName || "")}" placeholder="Ihre Objektverwaltung"></label>
      <label class="field wide"><span>${tl("E-Mail des Finanzteams", "Finance team email")}</span><input type="email" id="set-fin" value="${esc(S.settings.financeEmail || "")}"></label></div>
      <p class="muted" style="font-size:13px;margin:8px 0 0">${tl("Angebote über der Grenze brauchen ein zweites Angebot. Name und Finanz-E-Mail werden in die E-Mail-Entwürfe eingesetzt.", "Quotes above the limit need a second quote. Name and finance email are used in the email drafts.")}</p></section>
  </div>`;
}

/* ---------- Störung aufnehmen ---------- */
function viewCall() {
  const props = vals("properties");
  const p = S.properties[CALL.prop];
  const machines = vals("machines").filter(m => m.propertyId === CALL.prop);
  const m = S.machines[CALL.machine];
  const cat = callCat();
  const isOther = CALL.sym === "__other";
  const sym = cat?.sym.find(s => s.id === CALL.sym);
  const tenantContacts = (p?.contacts || []).filter(c => c.role === "tenant");
  let h = `<div class="head"><div><div class="eyebrow">${tl("Anruf läuft", "Call in progress")}</div><h1>${tl("Störung aufnehmen", "Log a fault")}</h1></div>${CALL.prop ? `<button class="btn ghost" data-act="call-reset">${tl("Neu beginnen", "Start over")}</button>` : ""}</div><div class="steps">`;
  h += `<section class="step"><div class="n">1 · ${tl("Welches Objekt?", "Which property?")}</div><div class="row">${props.length ? props.map(x => `<button class="chip ${CALL.prop === x.id ? "on" : ""}" data-call-prop="${x.id}">${esc(x.name)}</button>`).join("") : `<span class="muted">${tl("Noch keine Objekte.", "No properties yet.")}</span> <button class="btn sm" data-act="new-prop">${tl("Objekt anlegen", "Add property")}</button>`}</div>
    ${p ? `<p class="muted" style="margin:8px 0 0;font-size:13px">${tl("Mieter", "Tenant")}: ${esc(p.tenant || "–")}${p.tenantContact ? " · " + esc(p.tenantContact) : ""}${tenantContacts.map(c => ` · ${esc(c.name)} <span class="mono">${esc(c.phone || "")}</span>`).join("")}</p>` : ""}</section>`;
  if (CALL.prop) {
    h += `<section class="step"><div class="n">2 · ${tl("Welche Anlage?", "Which equipment?")}</div><div class="row">
      <button class="chip ${!CALL.machine && CALL.cat === "general" ? "on" : ""}" data-call-cat="general"><span class="code">GEB</span>${tl("Allgemein / Gebäude", "General / building")}</button>
      ${machines.map(x => `<button class="chip ${CALL.machine === x.id ? "on" : ""}" data-call-machine="${x.id}"><span class="code">${esc(catOf(x)?.code || "")}</span>${esc(machineName(x))}${x.location ? ` <span class="muted" style="font-weight:400">· ${esc(x.location)}</span>` : ""}</button>`).join("")}</div>
      <details style="margin-top:10px" ${!machines.length ? "open" : ""}><summary class="muted">${tl("Nicht in der Liste? Anlagentyp wählen", "Not listed? Pick a type")}</summary><div class="row" style="margin-top:8px">${Object.entries(CATALOG).filter(([k]) => k !== "general").map(([k, c]) => `<button class="chip ${!CALL.machine && CALL.cat === k ? "on" : ""}" data-call-cat="${k}"><span class="code">${c.code}</span>${esc(tr(c.name))}</button>`).join("")}</div></details></section>`;
  }
  if (cat) {
    h += `<section class="step"><div class="n">3 · ${tl("Was ist das Problem?", "What's the problem?")}</div><div class="row">${cat.sym.map(s => `<button class="chip ${CALL.sym === s.id ? "on" : ""}" data-call-sym="${s.id}"><span class="sev ${s.sev}" style="padding:0;background:none"></span>${esc(tr(s.l))}</button>`).join("")}
      <button class="chip ${isOther ? "on" : ""}" data-call-sym="__other">✎ ${tl("Sonstiges Problem", "Other problem")}</button></div>
      ${isOther ? `<div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">${tl("Wie dringend?", "How urgent?")}</div><div class="seg">${Object.keys(SEV).map(k => `<button class="chip ${CALL.sev === k ? "on" : ""}" data-call-sev="${k}">${sevPill(k)}</button>`).join("")}</div></div>` : ""}
      <label class="field" style="margin-top:12px"><span>${tl("Notizen / genaue Worte des Mieters", "Notes / the tenant's exact words")}</span><textarea id="call-text" placeholder="${tl("z. B. „Display zeigt F28, Druck 0,8 bar, Halle B kalt“", "e.g. „display shows F28, pressure 0.8 bar, hall B cold“")}">${esc(CALL.text)}</textarea></label></section>`;
  }
  if (cat && isOther) {
    h += `<section class="panel"><p style="margin:0">${tl("Beschreibe oben, was der Mieter sagt, und tippe auf „KI fragen“. Die KI schätzt ein, wie dringend es ist, was die Ursache sein kann und wen du anrufen solltest.", "Describe what the tenant says above and tap „Ask AI“. The AI estimates how urgent it is, the likely cause and who to call.")}</p></section>
    <section class="panel"><h2>${tl("Wer muss kommen?", "Who should come?")}</h2><div class="callwho">${whoToCall(cat, m)}</div></section>`;
  }
  if (sym) {
    const sv = sym.sev;
    h += `<section class="light ${sv}"><div class="lamp" aria-hidden="true"><i class="r"></i><i class="a"></i><i class="g"></i></div><div><div class="eyebrow">${tl("Einstufung", "Severity")}</div><h2>${esc(tr(SEV[sv].label))}</h2><p style="margin:6px 0 0">${esc(tr(sym.act) || tr(SEV[sv].hint))}</p></div></section>
    <div class="grid g2">
      <section class="panel"><h2>${tl("Diese Fragen jetzt stellen", "Ask these questions now")}</h2>${sym.q.length ? `<ul class="qs">${sym.q.map((q, i) => `<li><label><input type="checkbox" data-q="${i}" ${CALL.checked[i] ? "checked" : ""}><span>${esc(tr(q))}</span></label></li>`).join("")}</ul>` : `<p class="muted">–</p>`}</section>
      <section class="panel"><h2>${tl("Wer muss kommen?", "Who should come?")}</h2><div class="callwho">${whoToCall(cat, m)}</div></section>
    </div>
    <section class="panel"><h2>${tl("Mögliche Ursachen", "Likely causes")}</h2><div>${[...sym.c].sort((a, b) => b.p - a.p).map(c => `<div class="cause"><div>${meter(c.p)}</div><div><div style="font-weight:700">${esc(tr(c.t))} <span class="cost">${costSigns(c.k)}</span></div><div class="muted" style="font-size:14px">${esc(tr(c.w))}</div></div></div>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">${tl("Balken = wie wahrscheinlich · € = grobe Kostenklasse. Eine Ferndiagnose ersetzt keinen Techniker.", "Bars = how likely · € = rough cost class. A remote guess does not replace a technician.")}</p></section>`;
  }
  if (cat) h += aiDiagnosisBlock();
  if (cat && CALL.prop) h += `<div class="row"><button class="btn primary" data-act="call-ticket">${tl("Reparatur-Ticket anlegen", "Create repair ticket")}</button><span class="muted" style="font-size:13px">${tl("Speichert Objekt, Anlage, Einstufung und deine Notizen.", "Saves property, equipment, severity and your notes.")}</span></div>`;
  return h + `</div>`;
}
function whoToCall(cat, m) {
  const cs = contractorsFor(cat.trade, m);
  return cs.length ? cs.slice(0, 3).map(contactCard).join("") : `<p class="muted">${tl("Kein Dienstleister für", "No contractor for")} „${esc(tr(TRADES[cat.trade]))}“ ${tl("hinterlegt.", "saved yet.")}</p><button class="btn sm" data-act="new-contr" data-trade="${cat.trade}">${tl("Dienstleister anlegen", "Add contractor")}</button>`;
}
function aiDiagnosisBlock() {
  if (!sample) return `<section class="panel muted" style="font-size:14px">${tl("KI-Diagnose ist in dieser Ansicht nicht verfügbar.", "AI diagnosis isn't available in this view.")}</section>`;
  const a = CALL.ai;
  return `<section class="ai"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">${tl("KI-Diagnose", "AI diagnosis")}</div><h3>${tl("Aus den genauen Worten des Mieters", "From the tenant's exact words")}</h3></div>
    <button class="btn primary sm" data-act="call-ai" ${CALL.busy ? "disabled" : ""}>${CALL.busy ? `<span class="spin"></span> ${tl("Denkt nach…", "Thinking…")}` : tl("KI fragen", "Ask AI")}</button></div>
    ${a ? `<div style="margin-top:12px" class="prose">
      <p>${sevPill(a.severity)} <b>${esc(a.summary)}</b></p>
      ${a.firstSteps?.length ? `<p class="eyebrow" style="margin-top:10px">${tl("Sofort tun", "Do now")}</p><ul>${a.firstSteps.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${a.causes?.length ? `<p class="eyebrow">${tl("Wahrscheinliche Ursachen", "Likely causes")}</p>${a.causes.map(c => `<div class="cause"><div>${meter(Math.max(1, Math.min(3, Number(c.likelihood) || 1)))}</div><div><b>${esc(c.title)}</b><div class="muted" style="font-size:14px">${esc(c.explanation)}</div></div></div>`).join("")}` : ""}

function ticketLog(t) {
  const log = [...(t.log || [])];
  if (!log.find(e => e.type === "created")) log.unshift({ at: (t.created || today()) + "T08:00", type: "created", note: "" });
  return log.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
}
function viewTicket(id) {
  const t = S.tickets[id];
  if (!t) return `<div class="empty"><b>${tl("Ticket nicht gefunden", "Ticket not found")}</b><a href="#tickets">${tl("Zur Liste", "Back to list")}</a></div>`;
  const m = S.machines[t.machineId]; const p = S.properties[t.propertyId]; const c = ticketCat(t);
  const lim = Number(S.settings.limit) || 0;
  const qA = Number(t.quoteA) || 0, qB = Number(t.quoteB) || 0, cost = Number(t.cost) || 0;
  const hist = vals("tickets").filter(x => x.id !== id && x.cat === t.cat && Number(x.cost) > 0);
  const avg = hist.length ? hist.reduce((s, x) => s + Number(x.cost), 0) / hist.length : 0;
  let check = "";
  const maxQ = Math.max(qA, qB);
  if (qA && !qB && qA > lim) check = `<div class="check warn"><b>${tl("Über deiner Freigabegrenze", "Above your approval limit")} (${money(lim)}).</b> ${tl("Hol ein zweites Angebot ein, bevor du beauftragst.", "Get a second quote before you approve.")}</div>`;
  else if (qA && qB) { const lo = Math.min(qA, qB), hi = Math.max(qA, qB); check = `<div class="check ${hi - lo > lo * 0.15 ? "warn" : "ok"}">${tl("Günstiger", "Cheaper")}: <b>${esc(qA <= qB ? (t.quoteAFrom || "1") : (t.quoteBFrom || "2"))}</b> ${tl("mit", "at")} <b class="mono">${money(lo)}</b>. ${tl("Unterschied", "Difference")}: <span class="mono">${money(hi - lo)}</span> (${Math.round((hi - lo) / lo * 100)} %).</div>`; }
  else if (qA) check = `<div class="check ok">${tl("Innerhalb deiner Freigabegrenze.", "Within your approval limit.")}</div>`;
  if (avg && maxQ) check += `<div class="check ${maxQ > avg * 1.3 ? "bad" : "ok"}" style="margin-top:8px">${tl("Bisher bezahlt für ähnliche Reparaturen", "Paid before for similar repairs")}: <b class="mono">${money(avg)}</b> ${tl("im Schnitt", "on average")} (${hist.length}×).${maxQ > avg * 1.3 ? " " + tl("Dieses Angebot liegt deutlich darüber.", "This quote is clearly higher.") : ""}</div>`;
  const lowQ = [qA, qB].filter(Boolean).sort((a, b) => a - b)[0];

  return `<div class="head"><div><div class="eyebrow"><a href="#p-${t.propertyId}">${esc(propName(t.propertyId))}</a>${m ? ` / <a href="#m-${m.id}">${esc(machineName(m))}</a>` : ""}</div><h1>${esc(t.title)}${example(t)}</h1>

  ${t.ai?.summary ? `<div class="ai" style="margin-bottom:14px;font-size:14px"><div class="eyebrow">${tl("KI-Einschätzung beim Anruf", "AI assessment from the call")}</div>${esc(t.ai.summary)}</div>` : ""}
  <div class="grid g2" style="margin-bottom:14px">

      <label class="field"><span>${tl("Termin Techniker", "Technician appointment")}</span>${inp("appointment", "datetime-local")}</label>
      <label class="field"><span>${tl("Wer zahlt?", "Who pays?")}</span>${sel("payer", [["", "–"], ...Object.entries(PAYERS).map(([k, v]) => [k, tr(v)])])}</label>
      <label class="field wide"><span>${tl("Beschreibung / Notizen", "Description / notes")}</span><textarea data-tf="notes" id="tf-notes">${esc(t.notes || "")}</textarea></label>

        <div class="eyebrow" style="margin:16px 0 6px">${tl("Was hat er gesagt?", "What did they say?")}</div><textarea id="brief-answer" placeholder="${tl("z. B. „Kommt morgen 10 Uhr, ca. 300 €, Anfahrt 45 € extra“", "e.g. „Coming tomorrow 10am, about €300, call-out €45 extra“")}"></textarea>

    <dl class="kv" style="margin-bottom:10px"><dt>${tl("An", "To")}</dt><dd>${mail.to ? `<span class="mono" style="user-select:all">${esc(mail.to)}</span>` : `<span class="muted">${esc(mail.toHint)}</span>`}</dd><dt>${tl("Betreff", "Subject")}</dt><dd><b>${esc(mail.subject)}</b></dd></dl>
    <div class="mail" id="mail-body">${esc(mail.body)}</div>
    ${lang === "en" ? `<details style="margin-top:8px"><summary class="muted">English translation</summary><div class="mail" style="margin-top:6px">${esc(mail.en)}</div></details>` : ""}
    <div class="row" style="margin-top:10px">${copyBtn(mail.subject).replace(tl("Kopieren", "Copy"), tl("Betreff kopieren", "Copy subject"))}<button class="btn sm" data-copy-el="mail-body">${tl("Text kopieren", "Copy text")}</button><button class="btn sm primary" data-act="mail-sent" data-id="${id}">✉ ${tl("Als gesendet markieren", "Mark as sent")}</button></div></section>
  <div class="grid g2">

      <label class="field"><span>${tl("Angebot 1 (€)", "Quote 1 (€)")}</span>${inp("quoteA", "number", 'min="0"')}</label>

        ${neg ? `<ul style="margin:10px 0">${(neg.arguments || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul><div class="mail" id="neg-mail"><b>${esc(neg.subject || "")}</b>\n\n${esc(neg.body || "")}</div><button class="btn sm" style="margin-top:8px" data-copy-el="neg-mail">${tl("E-Mail kopieren", "Copy email")}</button>${neg.bodyEn ? `<details style="margin-top:8px"><summary class="muted">${tl("Übersetzung", "Translation")}</summary><p style="white-space:pre-wrap;font-size:14px">${esc(neg.bodyEn)}</p></details>` : ""}` : ""}</div>` : ""}</section>
    <section class="panel"><h2>${tl("Abschluss", "Closing")}</h2><div class="form">
      <label class="field"><span>${tl("Erledigt am", "Done on")}</span>${inp("doneAt", "datetime-local")}</label>
      <label class="field"><span>${tl("Ausgeführt von", "Done by")}</span>${sel("doneBy", contrOpts)}</label>
      <label class="field"><span>${tl("Endgültige Kosten (€)", "Final cost (€)")}</span>${inp("cost", "number", 'min="0"')}</label>
      <div class="field"><span>${tl("Rechnung", "Invoice")}</span>${t.invoiceId ? `<a class="btn sm" href="${blob(t.invoiceId)}" target="_blank" rel="noopener">${tl("Rechnung ansehen", "View invoice")}</a>` : ""}${assets ? `<label class="btn sm" style="cursor:pointer;width:max-content">${t.invoiceId ? tl("Ersetzen", "Replace") : tl("Foto / PDF hochladen", "Upload photo / PDF")}<input type="file" accept="image/*,application/pdf" data-invoice="${id}" hidden></label>` : ""}</div>
      <div class="wide">${invCheck}</div></div></section>
  </div>

/* ---------- Briefing & E-Mails ---------- */
function ticketFacts(t) {
  const m = S.machines[t.machineId]; const p = S.properties[t.propertyId] || {}; const c = ticketCat(t); const s = symOf(t);
  const mDe = m ? `${m.name || c?.name.de || "Anlage"}${m.brand || m.model ? ` (${[m.brand, m.model].filter(Boolean).join(" ")}${m.year ? ", Baujahr " + m.year : ""})` : ""}${m.location ? ", Standort: " + m.location : ""}` : (c ? c.name.de : "");
  const mEn = m ? `${m.name || c?.name.en || "unit"}${m.brand || m.model ? ` (${[m.brand, m.model].filter(Boolean).join(" ")}${m.year ? ", built " + m.year : ""})` : ""}${m.location ? ", location: " + m.location : ""}` : (c ? c.name.en : "");
  const contr = S.contractors[t.contractorId];
  const tenantC = (p.contacts || []).find(x => x.role === "tenant");
  return { m, p, c, s, mDe, mEn, contr, tenantC, sign: S.settings.signName || "Ihre Objektverwaltung", addr: [p.name, p.address].filter(Boolean).join(", ") };
}
function briefing(t) {
  const f = ticketFacts(t);
  const sev = SEV[t.severity] || SEV.amber;
  const urgDe = { red: "Es ist ein Notfall.", amber: "Es ist dringend, bitte heute oder morgen.", green: "Es ist nicht eilig, der nächste freie Termin reicht." }[t.severity] || "";
  const urgEn = { red: "It's an emergency.", amber: "It's urgent, today or tomorrow please.", green: "It's not urgent, the next free slot is fine." }[t.severity] || "";
  const de = `Guten Tag, hier ist ${f.sign}. Im Objekt ${f.addr} gibt es eine Störung: ${f.s.l.de}${f.mDe ? `, betroffen ist ${f.mDe}` : ""}.${t.notes ? ` Der Mieter sagt: ${t.notes.split("\n")[0]}.` : ""} ${urgDe} Wann können Sie kommen?`;
  const en = `Hello, this is ${f.sign}. At ${f.addr} there is a fault: ${f.s.l.en}${f.mEn ? `, affecting ${f.mEn}` : ""}.${t.notes ? ` The tenant says: ${t.notes.split("\n")[0]}.` : ""} ${urgEn} When can you come?`;
  const text = [f.c?.what.de, ...(f.c?.sym || []).flatMap(s => [s.act.de, ...s.c.map(x => x.t.de + " " + x.w.de)])].join(" ").toLowerCase();
  const terms = GLOSSARY.filter(g => { const w = g[0].split(/[ (/]/)[0].toLowerCase(); return w.length > 3 && text.includes(w); }).slice(0, 8);
  return { de: de.replace(/\.\./g, "."), en: en.replace(/\.\./g, "."), terms, sev };
}
const MAIL_KINDS = [["order", L("Auftrag", "Order")], ["reminder", L("Erinnerung", "Reminder")], ["quote", L("Angebot anfragen", "Request quote")], ["tenant", L("Info an Mieter", "Tenant update")], ["finance", L("Finanzteam", "Finance team")]];
function mailDraft(kind, t) {
  const f = ticketFacts(t);
  const sevDe = (SEV[t.severity] || SEV.amber).label.de, sevEn = (SEV[t.severity] || SEV.amber).label.en;
  const notes = (t.notes || "").trim();
  const onSite = f.tenantC ? `${f.tenantC.name}${f.tenantC.phone ? ", Tel. " + f.tenantC.phone : ""}` : (f.p.tenantContact || f.p.tenant || "");
  const lim = Number(S.settings.limit) || 0;
  const firstContact = (t.log || []).filter(e => e.type === "email" || e.type === "call").map(e => e.at).sort()[0];
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowDe = tomorrow.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" });
  const contrMail = f.contr?.email || "";
  const hi = "Sehr geehrte Damen und Herren,";
  const bye = `Mit freundlichen Grüßen\n${f.sign}`;
  const byeEn = `Kind regards\n${f.sign}`;
  const subjBase = `${f.s.l.de} – ${f.p.name || ""}`;
  const block = `Objekt: ${f.addr}\n${f.mDe ? "Anlage: " + f.mDe + "\n" : ""}Problem: ${f.s.l.de}\n${notes ? "Details: " + notes + "\n" : ""}Dringlichkeit: ${sevDe}`;
  const blockEn = `Property: ${f.addr}\n${f.mEn ? "Equipment: " + f.mEn + "\n" : ""}Problem: ${f.s.l.en}\n${notes ? "Details: " + notes + "\n" : ""}Urgency: ${sevEn}`;
  if (kind === "order") return { to: contrMail, toHint: tl("Dienstleister im Ticket wählen (E-Mail beim Dienstleister hinterlegen)", "Choose a contractor on the ticket (save their email)"), subject: `Reparaturauftrag: ${subjBase}`,
    body: `${hi}\n\nwir beauftragen Sie mit der Prüfung und Behebung folgender Störung:\n\n${block}\n\nAnsprechpartner vor Ort: ${onSite || "bitte bei uns erfragen"}\n\nBitte teilen Sie uns kurz mit, wann Sie vor Ort sein können.${lim ? ` Sollten die Kosten voraussichtlich ${moneyDe(lim)} überschreiten, bitten wir vorab um ein Angebot.` : ""} Nach dem Einsatz bitten wir um einen kurzen Arbeitsbericht.\n\n${bye}`,
    en: `Dear Sir or Madam,\n\nwe ask you to inspect and fix the following fault:\n\n${blockEn}\n\nContact on site: ${onSite || "please ask us"}\n\nPlease let us know when you can come.${lim ? ` If the cost is likely to exceed ${money(lim)}, please send a quote first.` : ""} Please send a short job report afterwards.\n\n${byeEn}` };
  if (kind === "reminder") return { to: contrMail, toHint: tl("Dienstleister im Ticket wählen", "Choose a contractor on the ticket"), subject: `Erinnerung: ${subjBase}`,
    body: `${hi}\n\nwir hatten Sie${firstContact ? " am " + fmtDTde(firstContact) : ""} wegen folgender Störung kontaktiert und haben noch keine Rückmeldung erhalten:\n\n${block}\n\nBitte teilen Sie uns bis ${tomorrowDe} mit, wann Sie vor Ort sein können. Andernfalls müssen wir einen anderen Fachbetrieb beauftragen.\n\n${bye}`,
    en: `Dear Sir or Madam,\n\nwe contacted you${firstContact ? " on " + fmtDT(firstContact, "en-GB") : ""} about the fault below and have not heard back yet:\n\n${blockEn}\n\nPlease let us know by tomorrow when you can come. Otherwise we will have to hire another company.\n\n${byeEn}` };
  if (kind === "quote") return { to: contrMail, toHint: tl("Dienstleister im Ticket wählen", "Choose a contractor on the ticket"), subject: `Angebotsanfrage: ${subjBase}`,
    body: `${hi}\n\nfür folgende Reparatur bitten wir um ein schriftliches Angebot:\n\n${block}\n\nBitte schlüsseln Sie das Angebot nach Material, Arbeitszeit und Anfahrt auf und nennen Sie einen möglichen Termin. Eine Besichtigung vor Ort ist nach Absprache möglich (Ansprechpartner: ${onSite || "bitte bei uns erfragen"}).\n\n${bye}`,
    en: `Dear Sir or Madam,\n\nplease send us a written quote for the following repair:\n\n${blockEn}\n\nPlease break the quote down into materials, labour and call-out, and suggest a date. A site visit can be arranged (contact: ${onSite || "please ask us"}).\n\n${byeEn}` };
  if (kind === "tenant") {
    const appt = t.appointment ? `Der Techniker${f.contr ? " von " + f.contr.name : ""} kommt am ${fmtDTde(t.appointment)}. Bitte sorgen Sie dafür, dass er Zugang zu ${f.m?.location || "den betroffenen Räumen"} hat.` : `Wir haben ${f.contr ? f.contr.name : "einen Fachbetrieb"} informiert und melden uns, sobald ein Termin feststeht.`;
    const apptEn = t.appointment ? `The technician${f.contr ? " from " + f.contr.name : ""} will come on ${fmtDT(t.appointment, "en-GB")}. Please make sure they can access ${f.m?.location || "the affected area"}.` : `We have informed ${f.contr ? f.contr.name : "a contractor"} and will let you know as soon as there is a date.`;
    const done = t.status === "done";
    return { to: f.tenantC?.email || "", toHint: tl("E-Mail des Mieter-Kontakts im Objekt hinterlegen", "Save the tenant contact's email on the property"), subject: done ? `Erledigt: ${f.s.l.de}` : `Ihre Störungsmeldung: ${f.s.l.de}`,
      body: `Guten Tag${f.tenantC ? " " + f.tenantC.name : ""},\n\n${done ? `die gemeldete Störung (${f.s.l.de}) wurde${t.doneAt ? " am " + fmtDTde(t.doneAt) : ""} behoben. Bitte melden Sie sich, falls das Problem erneut auftritt.` : `vielen Dank für Ihre Meldung vom ${fmtDate(t.created, "de-DE")} (${f.s.l.de}${f.m ? ", " + (f.m.name || f.c?.name.de) : ""}).\n\n${appt}`}\n\n${bye}`,
      en: `Hello${f.tenantC ? " " + f.tenantC.name : ""},\n\n${done ? `the reported fault (${f.s.l.en}) was fixed${t.doneAt ? " on " + fmtDT(t.doneAt, "en-GB") : ""}. Please tell us if it happens again.` : `thank you for your report from ${fmtDate(t.created, "en-GB")} (${f.s.l.en}).\n\n${apptEn}`}\n\n${byeEn}` };
  }
  const cost = Number(t.cost) || 0; const q = Math.max(Number(t.quoteA) || 0, Number(t.quoteB) || 0);
  const payerDe = t.payer ? PAYERS[t.payer].de : "noch zu klären", payerEn = t.payer ? PAYERS[t.payer].en : "to be decided";
  if (t.status === "done" && cost) return { to: S.settings.financeEmail || "", toHint: tl("Finanz-E-Mail in der Übersicht unter Einstellungen eintragen", "Add the finance email under Preferences on the overview"), subject: `Rechnung zur Zahlung: ${subjBase}`,
    body: `Hallo Finanzteam,\n\nanbei die Rechnung${f.contr ? " von " + f.contr.name : ""} über ${moneyDe(cost)} für folgende Reparatur:\n\n${block}\n\nDie Arbeiten wurden${t.doneAt ? " am " + fmtDTde(t.doneAt) : ""} abgeschlossen.${q ? ` Das Angebot lag bei ${moneyDe(Math.min(...[t.quoteA, t.quoteB].map(Number).filter(Boolean)))}.` : ""}\nKostenträger: ${payerDe}\n\nBitte zur Zahlung anweisen.\n\nViele Grüße\n${f.sign}`,
    en: `Hello finance team,\n\nattached is the invoice${f.contr ? " from " + f.contr.name : ""} for ${money(cost)} for this repair:\n\n${blockEn}\n\nThe work was completed${t.doneAt ? " on " + fmtDT(t.doneAt, "en-GB") : ""}.\nWho pays: ${payerEn}\n\nPlease arrange payment.\n\nBest regards\n${f.sign}` };
  return { to: S.settings.financeEmail || "", toHint: tl("Finanz-E-Mail in der Übersicht unter Einstellungen eintragen", "Add the finance email under Preferences on the overview"), subject: `Kostenfreigabe: ${subjBase}`,
    body: `Hallo Finanzteam,\n\nfür folgende Reparatur bitte ich um Kostenfreigabe:\n\n${block}\n\n${q ? `Angebot${t.quoteB ? "e" : ""}: ${[t.quoteA && `${moneyDe(t.quoteA)}${t.quoteAFrom ? " (" + t.quoteAFrom + ")" : ""}`, t.quoteB && `${moneyDe(t.quoteB)}${t.quoteBFrom ? " (" + t.quoteBFrom + ")" : ""}`].filter(Boolean).join(", ")}\n` : "Ein Angebot liegt noch nicht vor.\n"}Freigabegrenze: ${moneyDe(lim)}\nKostenträger: ${payerDe}\n\nViele Grüße\n${f.sign}`,
    en: `Hello finance team,\n\nI'm asking for cost approval for this repair:\n\n${blockEn}\n\n${q ? `Quote(s): ${[t.quoteA && money(t.quoteA), t.quoteB && money(t.quoteB)].filter(Boolean).join(", ")}\n` : "No quote yet.\n"}Approval limit: ${money(lim)}\nWho pays: ${payerEn}\n\nBest regards\n${f.sign}` };
}

function viewInspections() {
  const is = vals("inspections").sort((a, b) => (a.next || "9").localeCompare(b.next || "9"));
  return `<div class="head"><div><div class="eyebrow">${tl("Prüfpflichten & Wartung", "Required checks & service")}</div><h1>${tl("Prüfungen", "Inspections")}</h1></div><button class="btn primary" data-act="new-insp">${tl("Prüfung eintragen", "Add inspection")}</button></div>

function logPatch(id, entries, changes = {}) {
  const t = S.tickets[id]; const log = [...(t.log || []), ...entries.map(e => ({ at: nowLocal(), note: "", ...e }))];
  return patch("tickets", id, { ...changes, log });
}
async function onTicketField(id, f, el) {
  const t = S.tickets[id]; if (!t) return;
  let v = el.value; const extra = [];
  if (["quoteA", "quoteB", "cost"].includes(f)) v = Number(v) || "";
  if (String(t[f] ?? "") === String(v)) return;
  const ch = { [f]: v };
  if (f === "status") {
    extra.push({ type: "status", note: tr(STATUS[v]) });
    if (v === "done") { if (!t.doneAt) ch.doneAt = nowLocal(); extra.push({ type: "done" }); }
  }
  if (f === "appointment" && v) extra.push({ type: "appointment", note: fmtDT(v) });
  if ((f === "quoteA" || f === "quoteB") && v) extra.push({ type: "quote", note: money(v) + ((f === "quoteA" ? t.quoteAFrom : t.quoteBFrom) ? " · " + (f === "quoteA" ? t.quoteAFrom : t.quoteBFrom) : "") });
  if (f === "contractorId" && v && t.status === "open") ch.status = "assigned";
  if (f === "doneBy" && v && !t.contractorId) ch.contractorId = v;
  await logPatch(id, extra, ch);
}
async function closeTicket(id) {
  const t = S.tickets[id];
  await logPatch(id, [{ type: "done" }], { status: "done", doneAt: t.doneAt || nowLocal(), doneBy: t.doneBy || t.contractorId || "" });
  toast(tl("Als erledigt abgeschlossen", "Marked as done"));
}

  let n = 0;
  for (const m of vals("machines").filter(m => m.propertyId === propId)) {
    const c = catOf(m); if (!c) continue;
    for (const x of c.insp) {
      if (existing.find(i => i.machineId === m.id && (i.title === x.l.de || i.title === x.l.en || (i.titleL && i.titleL.de === x.l.de)))) continue;
      const last = m.lastService || "";
      await save("inspections", uid(), { title: tr(x.l), titleL: x.l, propertyId: propId, machineId: m.id, months: x.m, last, next: last ? addMonths(last, x.m) : today() });
      n++;
    }
  }
  toast(n ? tl(`${n} Prüfungen hinzugefügt – bitte Termine prüfen`, `${n} inspections added – please check the dates`) : tl("Alle üblichen Prüfungen sind schon eingetragen", "All usual inspections are already listed"));
}

/* ---------- KI ---------- */
function aiErr(e) {
  if (e && e.code === "not_granted") toast(tl("KI wurde nicht erlaubt.", "AI access was not allowed."));
  else if (e && e.code === "rate_limited") toast(tl("Zu viele Anfragen, bitte kurz warten.", "Too many requests, please wait a moment."));
  else toast(tl("KI-Anfrage fehlgeschlagen.", "AI request failed."));
}
const LANGNAME = () => lang === "en" ? "English" : "German";
async function aiDiagnose() {
  const p = S.properties[CALL.prop], m = S.machines[CALL.machine], c = callCat(), s = c?.sym.find(x => x.id === CALL.sym);
  CALL.text = $("#call-text")?.value ?? CALL.text;
  CALL.busy = true; render(true);
  const prompt = `You help a new, non-technical property manager in Germany who is on the phone with a commercial tenant reporting a building fault. Explain simply, no jargon (or explain jargon in brackets). Write all text values in ${LANGNAME()}.
Context:
- Property: ${p ? `${p.name} (${p.type || ""}), tenant ${p.tenant || "?"}` : "unknown"}
- Equipment: ${c ? c.name.en : "unknown"}${m ? `; make ${m.brand || "?"}, model ${m.model || "?"}, year ${m.year || "?"}, location ${m.location || "?"}` : ""}
- Fault type chosen: ${s ? s.l.en : "other / not in list"}
- Tenant's words / notes: ${CALL.text || "(none)"}
Safety first: gas smell, water near electrics, burning smell, people trapped, fire alarm faults are emergencies.
Reply with only JSON: {"severity":"red|amber|green","summary":"one or two sentences","firstSteps":["..."],"causes":[{"title":"...","explanation":"plain words, what it means and who fixes it","likelihood":1}],"questions":["questions still to ask the tenant"],"whoToCall":"which trade/company type to call and how urgently"}. likelihood is 1-3. Max 4 causes, 4 steps, 4 questions.`;
  try {
    const r = await sample.json(prompt, { modelTier: "default" });
    if (r && typeof r === "object") { if (!SEV[r.severity]) r.severity = s?.sev || "amber"; CALL.ai = r; if (CALL.sym === "__other") CALL.sev = r.severity; }
  } catch (e) { aiErr(e); }
  CALL.busy = false; render(true);
}
function identifyPrompt() {
  return `This photo shows a piece of building equipment in a German commercial property (the type plate / Typenschild, or the unit itself). Identify it and read what you can. Explain it for a non-technical property manager in ${LANGNAME()}.
Known category keys: ${Object.entries(CATALOG).map(([k, c]) => `${k} (${c.name.en})`).join(", ")}. Use "other" if none fits.
Reply with only JSON:
{"category":"key or other","name":"short label for this unit","brand":"","model":"","serial":"","year":"4 digits or empty","power":"e.g. 24 kW or empty","summary":"2-3 plain sentences: what it is and does","commonFaults":[{"title":"","explanation":""}],"maintenance":"how often it needs service and by whom","warning":"safety note or empty",
"customType": null unless category is "other", then {"name":"type name","code":"3 capital letters","trade":"heating|electrical|doors|fire|lift|hvac|roof|caretaker|disposal|other","what":"plain explanation","faults":[{"title":"","severity":"red|amber|green","action":"what to do now","questions":["questions to ask the tenant"],"causes":[{"title":"","explanation":"","likelihood":2,"cost":2}]}]}}
Leave fields empty when unreadable; never guess serial numbers. Max 5 commonFaults; customType max 4 faults, 3 questions and 3 causes each (likelihood and cost 1-3).`;
}
async function aiIdentify(id, file) {
  const m = S.machines[id]; if (!m || !file) return;
  S.machines[id] = { ...m, _busy: true }; render();
  const photoId = await uploadFile(file);
  try {
    const r = await sample.json(identifyPrompt(), { images: [file], modelTier: "default" });
    const cur = { ...S.machines[id] }; delete cur._busy;
    const pick = k => (r && r[k] && String(r[k]).trim()) || cur[k] || "";
    let cat = cur.cat; let note = "";
    if (r && (CATALOG[r.category] || r.category === "other")) { if (r.category !== cur.cat && cur.cat) note = tl("Anlagentyp korrigiert.", "Equipment type corrected."); cat = r.category; }
    const upd = { ...cur, cat, brand: pick("brand"), model: pick("model"), serial: pick("serial"), year: pick("year"), power: pick("power"),
      name: cur.scanning ? (r?.name || tl("Unbekannte Anlage", "Unknown equipment")) : (cur.name || r?.name || ""),
      aiInfo: { summary: r?.summary || "", commonFaults: Array.isArray(r?.commonFaults) ? r.commonFaults.slice(0, 5) : [], maintenance: r?.maintenance || "", warning: r?.warning || "", lang } };
    delete upd.scanning;
    if (cat === "other" && r?.customType) upd.customType = r.customType;
    if (photoId) { if (cur.photoId) upd.plateId = photoId; else upd.photoId = photoId; }
    await save("machines", id, upd);
    toast((note ? note + " " : "") + tl("Foto ausgewertet – bitte Angaben kurz prüfen.", "Photo read – please check the details."));
  } catch (e) { const cur = { ...S.machines[id] }; delete cur._busy; if (photoId && !cur.photoId) cur.photoId = photoId; if (cur.scanning) { cur.name = tl("Unbekannte Anlage", "Unknown equipment"); delete cur.scanning; } await save("machines", id, cur); aiErr(e); }
}
async function scanNew(propId, file) {
  if (!file) return;
  const id = uid();
  UI.busy.scan = true;
  await save("machines", id, { propertyId: propId, cat: "other", name: tl("Wird erkannt …", "Identifying …"), scanning: true });
  location.hash = "m-" + id;
  await aiIdentify(id, file);
  UI.busy.scan = false; render(true);
}
async function aiMachineInfo(id) {
  const m = S.machines[id]; if (!m) return; const c = catOf(m);
  S.machines[id] = { ...m, _busy: true }; render();
  const prompt = `Explain this building equipment for a non-technical property manager in Germany, in ${LANGNAME()}, plain words: type ${c ? c.name.en : "unknown"}, make ${m.brand || "?"}, model ${m.model || "?"}, year ${m.year || "?"}. If you don't know this exact model, say so in the summary and describe the type in general.
Reply with only JSON: {"summary":"2-3 sentences","commonFaults":[{"title":"","explanation":""}],"maintenance":"","warning":""}. Max 5 faults.`;
  try {
    const r = await sample.json(prompt, { modelTier: "default" });
    const cur = { ...S.machines[id] }; delete cur._busy;
    await save("machines", id, { ...cur, aiInfo: { summary: r?.summary || "", commonFaults: Array.isArray(r?.commonFaults) ? r.commonFaults.slice(0, 5) : [], maintenance: r?.maintenance || "", warning: r?.warning || "", lang } });
  } catch (e) { const cur = { ...S.machines[id] }; delete cur._busy; S.machines[id] = cur; render(); aiErr(e); }
}
async function aiNegotiate(id) {
  const t = S.tickets[id]; const m = S.machines[t.machineId]; const c = ticketCat(t);
  const hist = vals("tickets").filter(x => x.id !== id && x.cat === t.cat && Number(x.cost) > 0).map(x => `${x.title}: ${x.cost} EUR`).slice(0, 6);
  S.tickets[id] = { ...t, _busy: true }; render(true);
  const prompt = `Help a property manager in Germany negotiate a repair quote with a contractor. Be firm but polite and fair; never insulting.
Repair: ${t.title}. Equipment: ${c ? c.name.en : "?"} ${m ? `${m.brand || ""} ${m.model || ""} (year ${m.year || "?"})` : ""}. Notes: ${t.notes || "-"}.
Quote 1: ${t.quoteA || "-"} EUR from ${t.quoteAFrom || "?"}. Quote 2: ${t.quoteB || "-"} EUR from ${t.quoteBFrom || "?"}. Internal approval limit: ${S.settings.limit} EUR. Past similar repairs: ${hist.join("; ") || "none"}.
Reply with only JSON: {"arguments":["4-6 short negotiation points in ${LANGNAME()}"],"subject":"German email subject","body":"German email (Sie-Form) to the contractor of the higher or only quote: ask for an itemised breakdown (Material, Arbeitszeit, Anfahrt), mention the comparison quote or past prices if any, ask for a better price, sign as ${S.settings.signName || "Ihre Objektverwaltung"}","bodyEn":"${lang === "en" ? "English translation of the email" : ""}"}`;
  try {
    const r = await sample.json(prompt, { modelTier: "default" });
    const cur = { ...S.tickets[id] }; delete cur._busy;
    await save("tickets", id, { ...cur, negotiation: { arguments: Array.isArray(r?.arguments) ? r.arguments : [], subject: r?.subject || "", body: r?.body || "", bodyEn: r?.bodyEn || "" } });
  } catch (e) { const cur = { ...S.tickets[id] }; delete cur._busy; S.tickets[id] = cur; render(true); aiErr(e); }
}

/* ---------- Erinnerungs-Alarm ---------- */
function checkReminders() {
  if ($("#modal-root").innerHTML) return;
  const now = nowLocal();
  const r = vals("reminders").find(x => !x.done && x.at && x.at <= now && !ALERTED.has(x.id) && (new Date(now) - new Date(x.at)) < 12 * 36e5);
  if (!r) return;
  ALERTED.add(r.id);
  openModal(`<div class="mhead"><div><div class="eyebrow">⏰ ${tl("Erinnerung", "Reminder")} · ${fmtDT(r.at)}</div><h2>${esc(r.subject)}</h2></div></div>
    <p style="margin:0 0 6px"><a href="#p-${r.propertyId}" data-close>${esc(propName(r.propertyId))}</a></p>${r.note ? `<p class="prose" style="white-space:pre-wrap">${esc(r.note)}</p>` : ""}
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-act="rem-snooze" data-id="${r.id}" data-min="60">${tl("In 1 Std.", "In 1 hour")}</button><button class="btn" data-act="rem-snooze" data-id="${r.id}" data-min="tomorrow">${tl("Morgen 9:00", "Tomorrow 9:00")}</button><button class="btn primary" data-act="rem-done" data-id="${r.id}">${tl("Erledigt", "Done")}</button></div>`);
}
setInterval(() => { checkReminders(); renderNav(); }, 30000);

/* ---------- Nach dem Rendern ---------- */
function afterRender(r) {
  if (r.startsWith("m-") && window.QRCode) {
    const el = $("#qr");
    if (el) { el.innerHTML = ""; try { new QRCode(el, { text: APP_URL + "#" + r, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
  }
  const ct = $("#call-text"); if (ct) ct.oninput = () => CALL.text = ct.value;
  const gq = $("#gloss-q"); if (gq) gq.oninput = () => { UI.glossQ = gq.value; $("#gloss-list").innerHTML = glossRows(); };
  const bp = $("#board-prop"); if (bp) bp.onchange = () => { UI.boardProp = bp.value; render(true); };
  [["set-limit", v => ({ limit: Number(v) || 0 })], ["set-sign", v => ({ signName: v })], ["set-fin", v => ({ financeEmail: v })]].forEach(([k, fn]) => { const el = $("#" + k); if (el) el.onchange = () => saveSettings(fn(el.value.trim())); });
  if (lastRoute === "dashboard" || !lastRoute) setTimeout(checkReminders, 400);
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act],[data-call-prop],[data-call-machine],[data-call-cat],[data-call-sym],[data-call-sev],[data-insp],[data-cat],[data-tfilter],[data-copy],[data-copy-el],[data-close],[data-overlay],[data-log],[data-mail]");
  if (!el) return;
  if (el.hasAttribute("data-overlay") && e.target !== el) return;
  if (el.hasAttribute("data-overlay") || el.hasAttribute("data-close")) { closeModal(); return; }
  const d = el.dataset;
  if (d.callProp != null) { if (CALL.prop !== d.callProp) Object.assign(CALL, { prop: d.callProp, machine: "", cat: "", sym: "", ai: null, checked: {} }); render(true); return; }
  if (d.callMachine != null) { const m = S.machines[d.callMachine]; Object.assign(CALL, { machine: d.callMachine, cat: m?.cat || "", sym: "", ai: null, checked: {} }); render(true); return; }
  if (d.callCat != null) { Object.assign(CALL, { machine: "", cat: d.callCat, sym: "", ai: null, checked: {} }); render(true); return; }
  if (d.callSym != null) { CALL.sym = d.callSym; CALL.checked = {}; render(true); return; }
  if (d.callSev != null) { CALL.sev = d.callSev; render(true); return; }
  if (d.insp != null) { inspForm(d.insp); return; }
  if (d.cat != null) { UI.catOpen = UI.catOpen === d.cat ? "" : d.cat; render(true); const x = $("#cat-detail"); if (x) x.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (d.tfilter != null) { UI.ticketFilter = d.tfilter; render(true); return; }
  if (d.mail != null) { UI.mailKind = d.mail; render(true); return; }
  if (d.log != null) { const note = ($("#log-note")?.value || "").trim(); if (d.log === "note" && !note) { toast(tl("Erst eine Notiz eintippen", "Type a note first")); return; } await logPatch(d.id, [{ type: d.log, note }]); toast(tl("Im Verlauf gespeichert", "Saved to timeline")); return; }
  if (d.copy != null || d.copyEl != null) {
    const text = d.copy != null ? d.copy : ($("#" + d.copyEl)?.innerText || "");
    try { await navigator.clipboard.writeText(text); toast(tl("Kopiert", "Copied")); }
    catch (_) { const n = d.copyEl ? $("#" + d.copyEl) : el.previousElementSibling; if (n) { const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast(tl("Markiert – mit Strg+C kopieren", "Selected – press Ctrl+C to copy")); }
    return;
  }
  const id = d.id;
  switch (d.act) {
    case "new-prop": propForm(); break;
    case "edit-prop": propForm(id); break;
    case "edit-building": buildingForm(id); break;
    case "new-contact": contactForm(d.prop); break;
    case "edit-contact": contactForm(d.prop, d.cid); break;
    case "del-contact": closeModal(); await patch("properties", d.prop, { contacts: (S.properties[d.prop].contacts || []).filter(x => x.id !== d.cid) }); break;
    case "new-machine": machineForm(null, d.prop); break;
    case "edit-machine": machineForm(id); break;
    case "new-contr": contrForm(null, d.trade); break;
    case "edit-contr": contrForm(id); break;
    case "new-insp": inspForm(); break;
    case "new-rem": remForm(null, d.prop); break;
    case "edit-rem": remForm(id); break;
    case "rem-done": closeModal(); await patch("reminders", id, { done: true }); break;
    case "rem-snooze": { closeModal(); let nat; if (d.min === "tomorrow") { const x = new Date(); x.setDate(x.getDate() + 1); nat = localISO(x).slice(0, 10) + "T09:00"; } else { nat = localISO(new Date(Date.now() + Number(d.min) * 6e4)); } ALERTED.delete(id); await patch("reminders", id, { at: nat }); toast(tl("Verschoben auf ", "Moved to ") + fmtDT(nat)); break; }
    case "del-rem": confirmDel(tl("Erinnerung löschen?", "Delete this reminder?"), () => remove("reminders", id)); break;
    case "del-prop": confirmDel(tl("Objekt mit allen Anlagen löschen?", "Delete this property and its equipment?"), async () => { for (const m of vals("machines").filter(m => m.propertyId === id)) await remove("machines", m.id); await remove("properties", id); location.hash = "objects"; }); break;
    case "del-machine": { const pid = S.machines[id]?.propertyId; confirmDel(tl("Anlage löschen?", "Delete this equipment?"), async () => { await remove("machines", id); location.hash = "p-" + pid; }); break; }
    case "del-contr": confirmDel(tl("Dienstleister löschen?", "Delete this contractor?"), () => remove("contractors", id)); break;
    case "del-insp": confirmDel(tl("Prüfung löschen?", "Delete this inspection?"), () => remove("inspections", id)); break;
    case "del-ticket": confirmDel(tl("Ticket löschen?", "Delete this ticket?"), async () => { await remove("tickets", id); location.hash = "tickets"; }); break;
    case "close-ticket": closeTicket(id); break;
    case "reopen-ticket": await logPatch(id, [{ type: "status", note: tr(STATUS.open) }], { status: "open" }); break;
    case "mail-sent": { const mail = mailDraft(UI.mailKind, S.tickets[id]); await logPatch(id, [{ type: UI.mailKind === "tenant" ? "tenant" : "email", note: mail.subject }]); toast(tl("Im Verlauf gespeichert", "Saved to timeline")); break; }
    case "log-answer": { const v = ($("#brief-answer")?.value || "").trim(); if (!v) { toast(tl("Erst die Antwort eintippen", "Type the answer first")); return; } await logPatch(id, [{ type: "call", note: v }]); toast(tl("Im Verlauf gespeichert", "Saved to timeline")); break; }
    case "negotiate": aiNegotiate(id); break;
    case "insp-done": { const i = S.inspections[id]; await patch("inspections", id, { last: today(), next: addMonths(today(), i.months) }); toast(tl("Erledigt – nächster Termin berechnet", "Done – next date calculated")); break; }
    case "suggest-insp": suggestInspections(d.prop); break;
    case "call-reset": Object.assign(CALL, { prop: "", machine: "", cat: "", sym: "", sev: "amber", text: "", ai: null, checked: {} }); render(true); break;
    case "call-ai": aiDiagnose(); break;
    case "call-ticket": createTicketFromCall(); break;
    case "call-from-machine": { const m = S.machines[id]; Object.assign(CALL, { prop: m.propertyId, machine: id, cat: m.cat, sym: "", text: "", ai: null, checked: {} }); break; }
    case "machine-ai": aiMachineInfo(id); break;
    case "qr-save": saveQR(id); break;
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.matches("[data-tf]")) { const id = route().slice(2); onTicketField(id, el.dataset.tf, el); return; }
  if (el.matches("[data-q]")) { CALL.checked[el.dataset.q] = el.checked; return; }
  if (el.matches("[data-plate]")) { aiIdentify(el.dataset.plate, el.files[0]); return; }
  if (el.matches("[data-scan]")) { scanNew(el.dataset.scan, el.files[0]); return; }
  if (el.matches("[data-photo-m]")) { const pid = await uploadFile(el.files[0]); if (pid) patch("machines", el.dataset.photoM, { photoId: pid }); return; }
  if (el.matches("[data-invoice]")) { const id = el.dataset.invoice; const fid = await uploadFile(el.files[0]); if (fid) { await logPatch(id, [{ type: "invoice", note: el.files[0].name }], { invoiceId: fid }); toast(tl("Rechnung gespeichert", "Invoice saved")); } return; }
  if (el.matches("[data-doc]")) { const id = el.dataset.doc; const f = el.files[0]; if (!f || !assets) return; const fid = await uploadFile(f); if (fid) { const m = S.machines[id]; await patch("machines", id, { docs: [...(m.docs || []), { id: fid, name: f.name }] }); toast(tl("Dokument gespeichert", "Document saved")); } }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal();
  if (e.key === "Enter" && e.target.matches("[data-insp]")) inspForm(e.target.dataset.insp);
});
$("#lang-de").onclick = () => setLang("de");
$("#lang-en").onclick = () => setLang("en");
function setLang(l) { lang = l; try { localStorage.setItem("ol-lang", l); } catch (e) {} render(true); }

function confirmDel(msg, fn) {
  openModal(`<div class="mhead"><h2>${esc(msg)}</h2></div><p class="muted">${tl("Das kann nicht rückgängig gemacht werden.", "This can't be undone.")}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>${tl("Abbrechen", "Cancel")}</button><button class="btn primary" id="cd-ok">${tl("Ja, löschen", "Yes, delete")}</button></div>`);
  $("#cd-ok").onclick = async () => { closeModal(); await fn(); };
}
async function saveQR(id) {
  const el = $("#qr canvas"); if (!el || !downloads) return;
  const m = S.machines[id];
  const out = document.createElement("canvas"); out.width = 420; out.height = 520;
  const g = out.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 420, 520); g.drawImage(el, 60, 40, 300, 300);
  g.fillStyle = "#111"; g.font = "bold 22px Arial"; g.textAlign = "center"; g.fillText(machineName(m).slice(0, 32), 210, 385);
  g.font = "16px Arial"; g.fillText(propName(m.propertyId).slice(0, 40), 210, 415); g.fillText((m.location || "").slice(0, 40), 210, 440);
  g.font = "13px monospace"; g.fillStyle = "#555"; g.fillText("ID " + id, 210, 480);
  out.toBlob(async b => { try { await downloads.save({ filename: `QR-${machineName(m).replace(/[^\wäöüÄÖÜß-]+/g, "-")}.png`, data: b }); } catch (e) { if (e && e.code !== "cancelled") toast(tl("Speichern nicht möglich", "Could not save")); } }, "image/png");
}

boot();
</script>
